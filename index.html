<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="google" content="notranslate">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v=9">
<title>Блокнот цен</title>
</head>
<body>
<header>
  <div class="srch"><span>🔍</span><input id="q" type="search" placeholder="Поиск товара или магазина" autocomplete="off"></div>
  <label class="ib" for="gal" aria-label="Скан чека">📷</label>
  <button class="plus" id="plus" type="button" aria-label="Добавить цену">＋</button>
</header>
<input type="file" id="gal" class="pick" accept="image/*">

<div class="tools">
  <div class="seg"><button id="vl" class="on" type="button">Список</button><button id="vt" type="button">Таблица</button></div>
  <select id="sort">
    <option value="name">А–Я</option>
    <option value="save">Выгода</option>
    <option value="date">Новые</option>
  </select>
  <button class="gear" id="gear" type="button" aria-label="Настройки">⚙</button>
</div>

<main id="main"></main>

<!-- добавление и редактирование -->
<div class="ov hidden" id="sheet">
  <div class="sh">
    <h2 id="shtitle">Новая цена</h2>
    <label class="l">Магазин</label>
    <input type="text" id="fstore" autocomplete="off">
    <div class="chips" id="chips"></div>
    <label class="l">Товар</label>
    <input type="text" id="fprod" autocomplete="off" list="dl-products" placeholder="Например: Ред Булл 0,25">
    <div class="two">
      <div><label class="l">Цена, ₽</label><input type="number" id="fprice" step="0.01" inputmode="decimal"></div>
      <div><label class="l">Штук в упаковке</label><input type="number" id="fqty" step="1" inputmode="decimal" value="1"></div>
    </div>
    <label class="l">Дата</label>
    <input type="date" id="fdate">
    <label class="rn hidden" id="rnrow"><input type="checkbox" id="frn"> Переименовать товар во всех записях</label>
    <div class="info" id="finfo"></div>
    <div class="acts">
      <button class="btn alt" id="fcancel" type="button">Закрыть</button>
      <button class="btn bad hidden" id="fdel" type="button">Удалить</button>
      <button class="btn" id="fsave" type="button">Сохранить</button>
    </div>
  </div>
</div>

<!-- настройки -->
<div class="ov hidden" id="settings">
  <div class="sh">
    <h2>Настройки</h2>
    <label class="l">Размер текста</label>
    <div class="two"><button class="btn alt" id="fsm" type="button">A−</button><button class="btn alt" id="fsp" type="button">A+</button></div>
    <label class="l">Резервная копия (Excel)</label>
    <a class="btn" href="/api/export.csv" style="text-decoration:none">⬇ Скачать для Excel</a>
    <label class="btn alt" for="imp">⬆ Загрузить из файла</label>
    <input type="file" id="imp" class="pick" accept=".csv,text/csv,text/plain">
    <div class="info" id="dbinfo"></div>
    <div class="acts"><button class="btn" id="setclose" type="button">Готово</button></div>
  </div>
</div>

<!-- проверка чека -->
<div class="page hidden" id="scan">
  <div class="ph"><button class="back" id="rcancel" type="button">‹</button><h2>Проверка чека</h2></div>
  <div class="rv">
    <div class="two">
      <div><label class="l">Магазин</label><input type="text" id="rstore" autocomplete="off"></div>
      <div><label class="l">Дата</label><input type="date" id="rdate"></div>
    </div>
    <div class="chips" id="rchips"></div>
    <div class="info" id="rinfo"></div>
    <div id="rrows"></div>
    <button class="btn alt" id="radd" type="button">＋ Добавить строку</button>
  </div>
  <div class="bar"><button class="btn" id="rsave" type="button">💾 Сохранить всё</button></div>
</div>

<div id="busy" class="hidden"></div>
<div id="toast" class="hidden"></div>
<datalist id="dl-products"></datalist>
<script src="/static/app.js?v=9"></script>
<script src="/static/scan.js?v=9"></script>
</body>
</html>
